              - column:
                  name: product_code
                  value: CREDIT_CARD_STANDARD
              - column:
                  name: apr
                  valueNumeric: null
              - column:
                  name: min_income
                  valueNumeric: null
              - column:
                  name: max_limit
                  valueNumeric: null
            where: version = 2
  - changeSet:
      id: 009-align-credit-config-v3
      author: neo-05
      changes:
        - insert:
            tableName: credit_config
            columns:
              - column:
                  name: version
                  valueNumeric: 3
              - column:
                  name: product_terms
                  value: STUDENT
              - column:
                  name: product_code
                  value: CREDIT_CARD_STANDARD

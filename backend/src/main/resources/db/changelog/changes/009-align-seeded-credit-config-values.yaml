databaseChangeLog:
  - changeSet:
      id: 009-align-credit-config-v1
      author: neo-05
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: SELECT COUNT(*) FROM credit_config WHERE version = 1
      changes:
        - update:
            tableName: credit_config
            columns:
              - column:
                  name: product_terms
                  value: PLATINUM
              - column:
                  name: dti_limit
                  valueNumeric: 0.45
              - column:
                  name: rounding_step
                  valueNumeric: 100
              - column:
                  name: sample_every
                  valueNumeric: 7
              - column:
                  name: effective_from
                  valueDate: 2026-07-28T00:00:00
              - column:
                  name: product_code
                  value: CREDIT_CARD_REWARDS
              - column:
                  name: apr
                  valueNumeric: null
              - column:
                  name: min_income
                  valueNumeric: null
              - column:
                  name: max_limit
                  valueNumeric: null
            where: version = 1

  - changeSet:
      id: 009-align-credit-config-v2
      author: neo-05
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: SELECT COUNT(*) FROM credit_config WHERE version = 2
      changes:
        - update:
            tableName: credit_config
            columns:
              - column:
                  name: product_terms
                  value: PREMIUM
              - column:

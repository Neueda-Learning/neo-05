databaseChangeLog:
  - changeSet:
      id: 008-allow-in-progress-credit-record
      author: neo-05
      comment: Evaluation fields are populated by the worker, not by the UC-00 acceptance transaction.
      changes:
        - dropColumn:
            tableName: credit_record
            columnName: applicant_fullname
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: reference
            columnDataType: VARCHAR(32)
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: credit_config_version
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: product_code
            columnDataType: VARCHAR(32)
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: annual_income
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: monthly_income
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: monthly_outgoings
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: income_basis_limit
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: requested_limit
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: product_max_limit
            columnDataType: INT
        - dropNotNullConstraint:
            tableName: credit_record
            columnName: apr
            columnDataType: DECIMAL(3,1)

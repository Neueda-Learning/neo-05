databaseChangeLog:
  - changeSet:
	  id: 005-insert-initial-credit-config
	  author: neo-05
	  preConditions:
		onFail: MARK_RAN
		onError: HALT
		- sqlCheck:
			expectedResult: "0"
			sql: SELECT COUNT(*) FROM credit_config WHERE version = 1
	  changes:
		- insert:
			tableName: credit_config
			columns:
			  - column:
				  name: version
				  valueNumeric: 1
			  - column:
				  name: product_terms
				  value: '{"STANDARD":{"minIncome":18000,"maxLimit":5000,"apr":12.9},"REWARDS":{"minIncome":24000,"maxLimit":8000,"apr":14.9},"STUDENT":{"minIncome":12000,"maxLimit":1500,"apr":9.9}}'
			  - column:
				  name: dti_limit
				  valueNumeric: 0.45
			  - column:
				  name: rounding_step
				  valueNumeric: 100
			  - column:
				  name: sample_every
				  valueNumeric: 7
			  - column:
				  name: effective_from
				  valueDate: 2026-07-28T00:00:00
	  rollback:
		- delete:
			tableName: credit_config
			where: version = 1

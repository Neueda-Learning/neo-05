# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-credit-config.yaml
  - include:
      file: db/changelog/changes/003-create-credit-record.yaml
  - include:
      file: db/changelog/changes/004-create-override-log.yaml
  - include:
      file: db/changelog/changes/005-insert-initial-config.yaml
  - include:
      file: db/changelog/changes/006-update-seeded-policy-profile-names.yaml
  - include:
      file: db/changelog/changes/006-update-credit-config-and-record.yaml
  - include:
      file: db/changelog/changes/007-add-credit-record-config-id-fk.yaml
  - include:
      file: db/changelog/changes/008-allow-in-progress-credit-record.yaml
  - include:
      file: db/changelog/changes/008-align-seeded-credit-config-values.yaml
  - include:
      file: db/changelog/changes/009-add-override-log-granted-limit.yaml
  - include:
      file: db/changelog/changes/010-add-machine-decision-reason.yaml
